services:
  app:
    build:
      context: .
      # Read from .env (gitignored) — see CARTO_API_KEY there.
      args:
        NEXT_PUBLIC_CARTO_API_KEY: ${CARTO_API_KEY}
    ports:
      # Bound to localhost only — not exposed to the LAN/internet
      - "127.0.0.1:3000:3000"
    volumes:
      # SQLite database — persisted in ./data/ next to this file
      - ./data:/data
    environment:
      DB_PATH: /data/seo-playground.db
    restart: unless-stopped
